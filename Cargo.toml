[package]
name = "oxide_ai_pssa"
version = "0.4.0"
edition = "2024"
authors = ["Sparticle62ops"]
description = "Plastic State-Space Architecture (PSSA) V2 with CPU SIMD & WebGPU Compute Backends"

[dependencies]
# HTTP/HTTPS streaming for corpus downloads
ureq = { version = "2.9", features = ["tls"] }

# WebGPU compute runtime & buffer casting
wgpu = { version = "0.19", features = ["wgsl"] }
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }

# Multi-threaded CPU fallback acceleration
rayon = "1.10"
tokenizers = { version = "0.22.1", default-features = false, features = ["fancy-regex"] }
# Explicit direct use validates persisted tokenizer policy before model allocation.
serde_json = "1.0"

# Optional native CUDA backend (cuBLAS). Enabled with --features cuda.
# dynamic-loading means the binary still builds and runs on machines with no
# CUDA driver present; the backend simply reports itself unavailable there.
[dependencies.cudarc]
version = "0.19"
optional = true
default-features = false
features = ["cuda-12060", "driver", "cublas", "dynamic-loading"]

[features]
default = []
cuda = ["dep:cudarc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
[dependencies.ratatui]
version = "0.29"
default-features = true

[dependencies.crossterm]
version = "0.28"
default-features = false
features = ["events", "event-stream"]
