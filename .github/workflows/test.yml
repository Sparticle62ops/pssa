name: test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run bit-exact and converter tests
        run: cargo test --release --test depth_one_parity --test qwen3 --test training_safeguards
